<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>404 — Proto A · Clap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#f92c2c;
    --ink:#3c4258;
    --muted:#888ea5;
    --line:#e5ebf2;
    --bg:#f9fbfd;
    --radius:16px;
    --font:"Poppins",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:300;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .wrap{width:100%;max-width:760px;text-align:center}

  /* ---- the clapperboard ---- */
  .clap{width:min(420px,100%);margin:0 auto 40px;cursor:pointer;perspective:900px}
  .clap-stick{height:54px;background:var(--ink);border-radius:6px 6px 0 0;
       transform-origin:8% 100%;transform:rotate(-14deg);
       transition:transform .45s cubic-bezier(.34,1.56,.64,1);
       display:flex;overflow:hidden}
  .clap:hover .clap-stick,.clap.snap .clap-stick{transform:rotate(0deg)}
  .clap-body{height:170px;background:var(--ink);border-radius:0 0 var(--radius) var(--radius);
       margin-top:4px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 28px}
  .stripe{flex:1}
  .stripe:nth-child(odd){background:#fff}
  .stripe:nth-child(even){background:var(--ink)}
  .row{display:flex;justify-content:space-between;align-items:baseline;
       border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:8px}
  .row:last-child{border-bottom:0}
  .row span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#999fb3}
  .row b{font-weight:600;font-size:15px;color:#fff;letter-spacing:.04em}
  .row b.err{color:var(--accent)}

  h1{font-size:clamp(40px,9vw,68px);font-weight:700;letter-spacing:-.02em;margin:0 0 14px}
  h1 em{font-style:normal;color:var(--accent)}
  p{max-width:44ch;margin:0 auto 34px;color:var(--muted);font-size:17px;line-height:1.65}

  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:14px 30px;border-radius:var(--radius);text-decoration:none;
       font-size:14px;font-weight:600;letter-spacing:.03em;transition:.25s}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(249,44,44,.28)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(249,44,44,.34)}
  .btn-ghost{border:1px solid var(--line);color:var(--ink);background:#fff}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .hint{margin-top:26px;font-size:12px;color:#b2c1ce;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="clap" onclick="this.classList.toggle('snap')">
    <div class="clap-stick">
      <i class="stripe"></i><i class="stripe"></i><i class="stripe"></i><i class="stripe"></i>
      <i class="stripe"></i><i class="stripe"></i><i class="stripe"></i><i class="stripe"></i>
    </div>
    <div class="clap-body">
      <div class="row"><span>Production</span><b>Camille Prothin</b></div>
      <div class="row"><span>Scène</span><b class="err">404</b></div>
      <div class="row"><span>Prise</span><b>—</b></div>
    </div>
  </div>

  <h1>Cette prise n'existe <em>pas</em>.</h1>
  <p>La page que vous cherchez n'a jamais été tournée, ou elle a fini au montage.
     Retour sur le plateau&nbsp;?</p>

  <div class="actions">
    <a class="btn btn-primary" href="/">Retour à l'accueil</a>
    <a class="btn btn-ghost" href="/projets">Voir les projets</a>
    <a class="btn btn-ghost" href="/photo">Voir les photos</a>
  </div>
  <div class="hint">Cliquez sur le clap</div>
</div>
</body>
</html>
