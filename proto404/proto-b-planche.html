<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>404 — Proto B · Planche contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#f92c2c;--ink:#3c4258;--muted:#888ea5;--line:#e5ebf2;
    --radius:16px;--font:"Poppins",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--font);font-weight:300;
       min-height:100vh;display:flex;align-items:center;padding:56px 24px}
  .wrap{width:100%;max-width:1080px;margin:0 auto;
        display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,80px);align-items:center}
  @media(max-width:860px){.wrap{grid-template-columns:1fr;gap:44px}}

  /* ---- left: editorial ---- */
  .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
          font-weight:600;margin:0 0 18px}
  h1{font-size:clamp(38px,6vw,60px);font-weight:700;line-height:1.06;letter-spacing:-.025em;margin:0 0 20px}
  h1 .strike{position:relative;white-space:nowrap}
  h1 .strike::after{content:"";position:absolute;left:-2%;right:-2%;top:56%;height:3px;
       background:var(--accent);transform:scaleX(0);transform-origin:left;
       animation:cut .7s .4s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes cut{to{transform:scaleX(1)}}
  p{color:var(--muted);font-size:17px;line-height:1.7;max-width:40ch;margin:0 0 32px}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:14px 28px;border-radius:var(--radius);text-decoration:none;font-size:14px;
       font-weight:600;letter-spacing:.03em;transition:.25s}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:var(--accent)}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink)}

  /* ---- right: contact sheet ---- */
  .sheet{background:#111319;padding:18px;border-radius:var(--radius);
         box-shadow:0 26px 60px rgba(60,66,88,.22)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .frame{aspect-ratio:3/2;border-radius:4px;position:relative;overflow:hidden;
         filter:grayscale(1) contrast(1.05);transition:.35s}
  .frame:hover{filter:none;transform:scale(1.04);z-index:2}
  .f1{background:linear-gradient(135deg,#6a708e,#b2c1ce)}
  .f2{background:linear-gradient(160deg,#43485c,#888ea5)}
  .f3{background:linear-gradient(120deg,#999fb3,#e5ebf2)}
  .f4{background:linear-gradient(200deg,#3c4258,#6a708e)}
  .f6{background:linear-gradient(140deg,#b2c1ce,#636a82)}
  .f7{background:linear-gradient(115deg,#636a82,#ecedef)}
  .f8{background:linear-gradient(175deg,#888ea5,#43485c)}
  .f9{background:linear-gradient(150deg,#e5ebf2,#999fb3)}
  /* the missing frame */
  .missing{background:transparent;border:1.5px dashed rgba(249,44,44,.75);filter:none;
           display:flex;align-items:center;justify-content:center;
           color:var(--accent);font-weight:700;font-size:clamp(18px,2.4vw,26px);letter-spacing:.04em}
  .missing:hover{transform:none}
  .sheet-foot{display:flex;justify-content:space-between;margin-top:14px;
       font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6a708e}
  .sheet-foot .dot{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p class="kicker">Erreur 404</p>
    <h1>Ce cliché n'est<br><span class="strike">pas au catalogue</span>.</h1>
    <p>La page demandée n'existe pas — ou plus. Le reste de la planche, lui,
       est bien là.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Accueil</a>
      <a class="btn btn-ghost" href="/photo">Photographie</a>
      <a class="btn btn-ghost" href="/contact">Me contacter</a>
    </div>
  </div>

  <div class="sheet">
    <div class="grid">
      <div class="frame f1"></div>
      <div class="frame f2"></div>
      <div class="frame f3"></div>
      <div class="frame f4"></div>
      <div class="frame missing">404</div>
      <div class="frame f6"></div>
      <div class="frame f7"></div>
      <div class="frame f8"></div>
      <div class="frame f9"></div>
    </div>
    <div class="sheet-foot"><span>Planche contact — 09 vues</span><span><span class="dot">●</span> 05 manquante</span></div>
  </div>
</div>
</body>
</html>
