<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>404 — Proto C · Perte de signal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#f92c2c;--radius:16px;--font:"Poppins",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0f1117;color:#fff;font-family:var(--font);
       font-weight:300;display:flex;align-items:center;justify-content:center;
       padding:48px 24px;overflow:hidden;position:relative}
  /* film grain + scanlines */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
       background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
  body::after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:2;opacity:.05;
       background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
       animation:grain 1.2s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
       50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(3%,3%)}}
  /* red spotlight */
  .glow{position:fixed;width:70vmax;height:70vmax;border-radius:50%;top:50%;left:50%;
        transform:translate(-50%,-58%);z-index:0;
        background:radial-gradient(circle,rgba(249,44,44,.16) 0%,transparent 62%);
        animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{50%{transform:translate(-50%,-58%) scale(1.12);opacity:.75}}

  .wrap{position:relative;z-index:4;text-align:center;max-width:640px}

  .code{font-size:clamp(110px,26vw,220px);font-weight:700;line-height:.86;letter-spacing:-.05em;
        position:relative;display:inline-block;margin-bottom:8px}
  .code span{position:absolute;inset:0}
  .code .r{color:var(--accent);mix-blend-mode:screen;animation:g1 3.2s infinite steps(1)}
  .code .c{color:#3ad9e0;mix-blend-mode:screen;animation:g2 3.2s infinite steps(1)}
  @keyframes g1{0%,88%{transform:translate(0,0);opacity:0}
    89%{transform:translate(-6px,2px);opacity:1}93%{transform:translate(5px,-3px);opacity:1}
    96%,100%{transform:translate(0,0);opacity:0}}
  @keyframes g2{0%,88%{transform:translate(0,0);opacity:0}
    90%{transform:translate(6px,-2px);opacity:1}94%{transform:translate(-4px,3px);opacity:1}
    97%,100%{transform:translate(0,0);opacity:0}}

  .rec{display:flex;justify-content:center;align-items:center;gap:9px;font-size:11px;letter-spacing:.3em;
       text-transform:uppercase;color:#999fb3;margin-bottom:26px}
  .rec i{width:8px;height:8px;border-radius:50%;background:var(--accent);
         animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.15}}

  h1{font-size:clamp(20px,3.4vw,28px);font-weight:600;letter-spacing:-.01em;margin:0 0 14px}
  p{color:#999fb3;font-size:16px;line-height:1.7;max-width:42ch;margin:0 auto 36px}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{padding:14px 30px;border-radius:var(--radius);text-decoration:none;font-size:14px;
       font-weight:600;letter-spacing:.03em;transition:.25s;backdrop-filter:blur(4px)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 0 34px rgba(249,44,44,.45)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 48px rgba(249,44,44,.65)}
  .btn-ghost{border:1px solid rgba(255,255,255,.2);color:#fff}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

  .tc{position:fixed;bottom:22px;left:0;right:0;z-index:4;text-align:center;
      font-size:11px;letter-spacing:.24em;color:#43485c}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="rec"><i></i>Signal perdu</div>
  <div class="code">404<span class="r">404</span><span class="c">404</span></div>
  <h1>Cette page n'est pas au catalogue</h1>
  <div class="actions">
    <a class="btn btn-primary" href="/">Retour à l'accueil</a>
    <a class="btn btn-ghost" href="/projets">Projets</a>
    <a class="btn btn-ghost" href="/contact">Contact</a>
  </div>
</div>
<div class="tc" id="tc">00:00:00:00</div>
<script>
  // Running timecode, purely decorative.
  var f = 0, el = document.getElementById('tc');
  setInterval(function(){
    f++;
    var fr = f % 25, s = Math.floor(f/25) % 60, m = Math.floor(f/1500) % 60, h = Math.floor(f/90000);
    var p = function(n){ return String(n).padStart(2,'0'); };
    el.textContent = p(h)+':'+p(m)+':'+p(s)+':'+p(fr);
  }, 40);
</script>
</body>
</html>
