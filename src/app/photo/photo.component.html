<!--portfolio start -->
<section id="portfolio" class="portfolio">

  <div class="container">
    <div class="portfolio-content">
      <div class="gallery">
        @for (photo of photos; track photo.id; let i = $index) {
          <div class="item">
            <button type="button" class="btn" (click)="open(i)">
              <img [src]="photo.src" [alt]="i18n.tc(photo.title)" loading="lazy"/>
            </button>
          </div>
        }
      </div>
    </div>

    <div class="instagram-cta">
      <p>{{ i18n.t('photo.instagramCta') }}</p>
      <a class="instagram-link" href="https://www.instagram.com/p___camille/" target="_blank" rel="noopener">
        <i class="bi bi-instagram" aria-hidden="true"></i>
        <span>&#64;p___camille</span>
      </a>
    </div>
  </div>

<!--portfolio end -->

<div class="polaroid-camera">
  <button id="button"></button>
  <div id="circle"></div>
  <div class="lens">
    <div class="reflection"></div>
  </div>
  <div class="flash"></div>
  <div class="stripes"></div>
  <div class="bottom">
    <div class="bottom-front"></div>
  </div>
  <div class="slot"></div>
  <div class="shadow"></div>
  <div id="photo" class="photo">
    <div class="house">
      <div class="windows"></div>
    </div>
    <div class="grey-alien">
      <div class="eye-left"></div>
      <div class="eye-right"></div>
    </div>
    <div class="ufo">
      <div class="outer"></div>
      <div class="inner"></div>
      <div class="lights">
          <div class="light light1"></div>
          <div class="light light2"></div>
          <div class="light light3"></div>
      </div>
  </div>
  </div>
</div>

</section>

@if (activePhoto; as photo) {
  <div class="lightbox" role="dialog" aria-modal="true" [attr.aria-label]="i18n.tc(photo.title)"
       (click)="close()">
    <button type="button" class="lightbox-close" [attr.aria-label]="i18n.t('photo.close')" (click)="close()">
      <span aria-hidden="true">&times;</span>
    </button>

    <button type="button" class="lightbox-nav prev" [attr.aria-label]="i18n.t('photo.prev')"
            (click)="$event.stopPropagation(); prev()">
      <span aria-hidden="true">&#8249;</span>
    </button>

    <figure class="lightbox-figure" (click)="$event.stopPropagation()">
      <img [src]="photo.src" [alt]="i18n.tc(photo.title)"/>
      <figcaption>
        <span class="lightbox-title">{{ i18n.tc(photo.title) }}</span>
        @if (photo.description) {
          <span class="lightbox-desc">{{ i18n.tc(photo.description) }}</span>
        }
      </figcaption>
    </figure>

    <button type="button" class="lightbox-nav next" [attr.aria-label]="i18n.t('photo.next')"
            (click)="$event.stopPropagation(); next()">
      <span aria-hidden="true">&#8250;</span>
    </button>
  </div>
}
